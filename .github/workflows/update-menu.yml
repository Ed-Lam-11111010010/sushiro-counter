name: Check for Sushiro menu updates

on:
  # Reviewed promotions may originate from official Instagram posts or other
  # off-site announcements. Once their verified data lands on master, refresh
  # the calculator immediately rather than waiting for the daily schedule.
  push:
    branches: [master]
    paths:
      - "data/promotions.json"
      - "scripts/update_menu.py"  # Recompute menu immediately after updater repairs
  schedule:
    # 22:00 UTC = 06:00 Hong Kong time. Run daily so verified promotions
    # become visible on their start date instead of waiting for a weekly run.
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: menu-update
  cancel-in-progress: false

jobs:
  update-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate approved on- and off-site promotions
        run: python -c "import json, sys; from pathlib import Path; sys.path.insert(0, 'scripts'); import update_menu; update_menu.validate_promotion_data(json.loads(Path('data/promotions.json').read_text(encoding='utf-8'))); print('Approved promotion data valid')"

      - name: Fetch and validate official menu
        run: python scripts/update_menu.py

      - name: Test menu ID and price validation
        run: python -m unittest discover -s scripts -p 'test_update_menu.py'

      - name: Test saved orders and bill recalculation
        run: node --test scripts/test-menu-load.cjs

      - name: Check for menu data changes
        id: menu-changes
        shell: bash
        run: |
          if git diff --quiet -- menu.json index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No menu data or fallback changes found."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open menu update PR when needed
        if: steps.menu-changes.outputs.changed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update Sushiro HK menu"
          branch: chore/auto-menu-update
          delete-branch: true
          title: "chore: update Sushiro HK menu"
          body: |
            Automated menu refresh from the official Sushiro HK pages.
            The scraper validates the menu schema before opening this PR.
          base: master

      - name: Merge menu update automatically
        if: steps.create-pr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pullNumber = Number('${{ steps.create-pr.outputs.pull-request-number }}');
            if (!pullNumber) {
              core.info('No menu changes to merge.');
              return;
            }

            const { data } = await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              merge_method: 'squash',
            });

            if (!data.merged) {
              core.setFailed(`Menu update PR #${pullNumber} was not merged: ${data.message}`);
              return;
            }

            core.info(`Merged menu update PR #${pullNumber} at ${data.sha}.`);

      - name: Trigger Pages deployment
        if: steps.create-pr.outputs.pull-request-number != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'master',
            });

            core.info('Triggered the GitHub Pages deployment for the merged menu.');
