name: Detect Sushiro Instagram menu candidates

on:
  schedule:
    # 22:00 UTC = 06:00 Hong Kong time. Public Instagram access is best effort.
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: instagram-menu-candidates
  cancel-in-progress: false

jobs:
  detect-instagram-menu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Detect public Instagram menu candidates
        run: python scripts/detect_instagram_menu.py

      - name: Test Instagram candidate safety
        run: python -m unittest discover -s scripts -p 'test_instagram_menu.py'

      - name: Test official menu updater
        run: python -m unittest discover -s scripts -p 'test_update_menu.py'

      - name: Test saved orders and bill recalculation
        run: node --test scripts/test-menu-load.cjs

      - name: Check candidate-only changes
        id: candidate-changes
        shell: bash
        run: |
          candidate_status="$(git status --porcelain -- data/instagram_candidates.json)"
          if git diff --quiet -- data/instagram_candidates.json && [ -z "$candidate_status" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No Instagram candidate changes found."
          else
            unexpected_status="$(git status --porcelain | grep -vE '^.. data/instagram_candidates\.json$' || true)"
            if ! git diff --quiet -- . ':!data/instagram_candidates.json' || [ -n "$unexpected_status" ]; then
              echo "Unexpected files changed outside data/instagram_candidates.json."
              git status --short
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open review-only candidate PR
        if: steps.candidate-changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: record Sushiro Instagram menu candidates"
          branch: chore/instagram-menu-candidates
          delete-branch: true
          title: "chore: review Sushiro Instagram menu candidates"
          body: |
            Automated best-effort discovery from the public Sushiro HK Instagram page.

            This PR is review-only. Do not merge until every candidate, price, date,
            source post, and branch availability has been checked against an official
            source. Instagram candidates are never promoted into menu.json or merged
            automatically by this workflow.
          base: master
